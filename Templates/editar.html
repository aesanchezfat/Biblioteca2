<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3>Editar Libro</h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <label>Título</label>

                        <input
                            class="form-control mb-3"
                            type="text"
                            name="titulo"
                            value="{{ libro.titulo }}"
                            required>

                        <label>Autor</label>

                        <input
                            class="form-control mb-3"
                            type="text"
                            name="autor"
                            value="{{ libro.autor }}"
                            required>

                        <label>ISBN</label>

                        <input
                            class="form-control mb-3"
                            type="text"
                            name="isbn"
                            value="{{ libro.isbn }}"
                            required>

                        <label>Cantidad</label>

                        <input
                            class="form-control mb-3"
                            type="number"
                            name="cantidad"
                            value="{{ libro.disponibles }}"
                            required>

                        <label>Sinopsis</label>

                        <textarea
                            class="form-control mb-3"
                            name="sinopsis"
                            rows="3"
                            placeholder="Escribe un resumen o sinopsis del libro...">{{ libro.sinopsis if libro.sinopsis else '' }}</textarea>

                        <label>Reporte de Incidencia / Estado</label>

                        <textarea
                            class="form-control mb-3"
                            name="reporte"
                            rows="2"
                            placeholder="Describe qué le pasó al libro o su estado actual...">{{ libro.reporte if libro.reporte else '' }}</textarea>

                        <label>Portada (Imagen)</label>

                        {% if libro.imagen %}
                        <div class="mb-2">
                            <img src="/Static/uploads/{{ libro.imagen }}" alt="{{ libro.titulo }}" style="max-width: 100px; max-height: 120px; object-fit: cover;" class="img-thumbnail d-block">
                        </div>
                        {% endif %}

                        <input
                            class="form-control mb-3"
                            type="file"
                            name="imagen"
                            accept="image/*">

                        <button
                            class="btn btn-warning w-100">

                            Guardar Cambios

                        </button>

                    </form>

                    <hr>

                    <a
                        href="/inicio"
                        class="btn btn-secondary w-100">

                        Cancelar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
