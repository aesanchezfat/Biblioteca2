<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reportar Incidencia del Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h3 class="mb-0">
                        Reporte de Estado / Incidencia
                    </h3>

                </div>

                <div class="card-body">

                    <h5 class="card-title">{{ libro.titulo }}</h5>
                    <p class="text-muted">Autor: {{ libro.autor }} | ISBN: {{ libro.isbn }}</p>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Explicación o Reporte de lo Sucedido
                            </label>

                            <textarea
                                class="form-control"
                                name="reporte"
                                rows="4"
                                placeholder="Describe qué le pasó al libro (ej. páginas dañadas, extraviado, portada manchada, etc.)...">{{ libro.reporte if libro.reporte else '' }}</textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-warning w-100">

                            Guardar Reporte

                        </button>

                    </form>

                    <hr>

                    <a
                        href="/inicio"
                        class="btn btn-secondary w-100">

                        Cancelar

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
