<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Crear Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        Crear Nuevo Usuario
                    </h3>

                </div>

                <div class="card-body">

                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre de Usuario
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="usuario"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required>

                        </div>

                        <div class="mb-3 form-check">

                            <input
                                type="checkbox"
                                class="form-check-input"
                                id="admin"
                                name="admin">

                            <label class="form-check-label" for="admin">
                                Es Administrador
                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Crear Usuario

                        </button>

                    </form>

                    <hr>

                    <a
                        href="/inicio"
                        class="btn btn-secondary w-100">

                        Volver

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
