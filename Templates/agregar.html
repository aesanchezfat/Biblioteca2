<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Agregar Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-success text-white">

                    <h3 class="mb-0">
                        Agregar Libro
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        <div class="mb-3">

                            <label class="form-label">

                                Título

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="titulo"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Autor

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="autor"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                ISBN

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="isbn"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Cantidad Disponible

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="cantidad"
                                min="1"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Sinopsis

                            </label>

                            <textarea
                                class="form-control"
                                name="sinopsis"
                                rows="3"
                                placeholder="Escribe un resumen o sinopsis del libro..."></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Reporte de Incidencia / Estado (Opcional)

                            </label>

                            <textarea
                                class="form-control"
                                name="reporte"
                                rows="2"
                                placeholder="Notas si el libro tiene algún detalle o daño..."></textarea>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Portada (Imagen)

                            </label>

                            <input
                                type="file"
                                class="form-control"
                                name="imagen"
                                accept="image/*">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Guardar Libro

                        </button>

                    </form>

                    <hr>

                    <a
                        href="/inicio"
                        class="btn btn-secondary w-100">

                        Volver

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
